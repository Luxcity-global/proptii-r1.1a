  # ═══════════════════════════════════════════════════════════════
  # SHEETS
  # ═══════════════════════════════════════════════════════════════

  /sheets:
    post:
      tags: [Sheets]
      summary: Append row to Google Sheet (waitlist or other)
      description: No auth required. Used by campaign landing pages to collect signups.
      parameters:
        - name: sheetId
          in: query
          schema: { type: string, default: waitlist }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any key-value pairs to append as a new row
              example:
                name: "James Okafor"
                email: "james@example.com"
                source: "campaign-page"
      responses:
        "201":
          description: Row appended

  /sheets/{sheetId}:
    get:
      tags: [Sheets]
      summary: Read sheet data (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: sheetId
          in: path
          required: true
