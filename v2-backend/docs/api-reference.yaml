  /admin/overview:
    get:
      tags: [Admin Dashboard]
      summary: Get platform overview stats (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Platform overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals:            { type: object }
                  funnel:            { type: object }
                  trialConversion:   { type: object }
                  tierDistribution:  { type: object }
                  accountStatus:     { type: object }
                  billingStatus:     { type: object }
