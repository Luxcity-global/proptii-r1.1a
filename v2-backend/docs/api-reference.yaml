          description: Lead submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:  { type: string }
                  leadId: { type: string }

  /leads/session:
    get:
      tags: [Leads]
      summary: Get personalised lead session data
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lead session data
          content:
            application/json:
