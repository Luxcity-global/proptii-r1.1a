<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proptii — Property Workflow Questionnaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Brand Typography */
      --font-heading: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Brand Palette */
      --color-primary: #136C9E;
      --color-primary-dark: #0d4e73;
      --color-primary-light: #eaf3f8;
      --color-primary-tint: #f0f7fb;

      --color-cta: #DC5F12;
      --color-cta-hover: #c4520d;
      --color-cta-shadow: rgba(220, 95, 18, 0.38);

      --color-accent: #FADB9D;
      --color-accent-dark: #7a4f00;
      --color-accent-light: #fffaf0;

      /* Canvas & Card Surfaces */
      --bg-canvas: #e9eff4;
      --bg-stripe: rgba(19, 108, 158, 0.045);
      --card-bg: #ffffff;

      /* Text Hierarchy */
      --text-primary: #11222e;
      --text-secondary: #4a6170;
      --text-tertiary: #849aa8;

      /* Borders & Controls */
      --border-light: #e1ebf2;
      --border-focus: #136C9E;
      --option-hover-bg: #f4f8fb;
      --option-selected-bg: #eaf3f9;
      --option-selected-border: #136C9E;
      --progress-inactive: #e0e9f0;
      --progress-active: #136C9E;

      /* Shadows & Radii */
      --shadow-card: 0 24px 50px -14px rgba(17, 34, 46, 0.16), 0 8px 22px -6px rgba(17, 34, 46, 0.08);
      --shadow-deck: 0 16px 36px -6px rgba(17, 34, 46, 0.14), 0 4px 12px rgba(17, 34, 46, 0.07);
      --shadow-lifted: 0 35px 70px -10px rgba(17, 34, 46, 0.28), 0 14px 28px -6px rgba(17, 34, 46, 0.12);
      --radius-card: 28px;
      --radius-option: 15px;
      --radius-btn: 13px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-canvas);
      background-image: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 72px,
        var(--bg-stripe) 72px,
        var(--bg-stripe) 73px
      );
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 24px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glow */
    .ambient-glow {
      position: fixed;
      width: 640px;
      height: 640px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(250, 219, 157, 0.35) 0%, rgba(19, 108, 158, 0.14) 40%, rgba(233, 239, 244, 0) 70%);
      pointer-events: none;
      z-index: 0;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: all 0.8s ease;
    }

    /* Proptii Brand Header */
    .proptii-header {
      position: relative;
      z-index: 20;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0.95;
      transition: transform 0.3s ease;
    }
    .proptii-header:hover {
      transform: translateY(-1px);
    }
    .proptii-logo-img {
      height: 38px;
      width: auto;
      max-width: 170px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(19, 108, 158, 0.12));
    }
    .brand-tag {
      font-size: 10.5px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--color-primary-dark);
      background: var(--color-primary-light);
      border: 1px solid rgba(19, 108, 158, 0.18);
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* =========================================================
       DECK VIEWPORT & PROMINENT STACKED LAYERS
       ========================================================= */
    .deck-viewport {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 640px;
      perspective: 1400px;
      margin: 10px auto 20px;
      z-index: 5;
    }

    /* Three physical stacked card layers behind - ALWAYS VISIBLE */
    .deck-card-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: var(--radius-card);
      pointer-events: none;
      background: #ffffff;
      border: 1.6px solid #cadce9;
      box-shadow: var(--shadow-deck);
      transform-origin: center 85%;
      transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    /* Layer 3: Furthest back, peeking out on top-right and right edge */
    .deck-layer-3 {
      z-index: 1;
      transform: translate(26px, -14px) rotate(4.8deg) scale(0.95);
      background: #fcfdfd;
    }

    /* Layer 2: Peeking out on top-left and left edge */
    .deck-layer-2 {
      z-index: 2;
      transform: translate(-22px, 12px) rotate(-3.6deg) scale(0.97);
      background: #ffffff;
    }

    /* Layer 1: Peeking out on right edge */
    .deck-layer-1 {
      z-index: 3;
      transform: translate(14px, 8px) rotate(2deg) scale(0.988);
      background: #ffffff;
    }

    /* Active Foreground & Staged Cards */
    .form-card {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100%;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1.5px solid rgba(19, 108, 158, 0.13);
      padding: 26px 28px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform-origin: center 85%;
      backface-visibility: hidden;
      will-change: transform, opacity, box-shadow;
      overflow: visible;
    }

    .form-card.is-active {
      z-index: 10;
      transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      pointer-events: auto;
      opacity: 1;
    }

    .form-card.is-staged {
      z-index: 4;
      transform: translate(14px, 8px) rotate(2deg) scale(0.988);
      pointer-events: none;
      opacity: 0.98;
    }

    /* Next / Back Animations */
    .form-card.anim-next-out {
      animation: cardSlideToBack 0.62s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
      pointer-events: none;
    }

    @keyframes cardSlideToBack {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        z-index: 12;
        box-shadow: var(--shadow-card);
      }
      38% {
        /* Slides straight out to the right without tilting */
        transform: translate3d(108%, 0, 0) rotate(0deg) scale(1.01);
        z-index: 12;
        box-shadow: var(--shadow-lifted);
        opacity: 1;
      }
      45% {
        /* Drops behind the stack */
        transform: translate3d(108%, 0, 0) rotate(0deg) scale(0.96);
        z-index: 2;
        opacity: 0.92;
      }
      100% {
        /* Settles neatly into the back of the deck */
        transform: translate(26px, -14px) rotate(4.8deg) scale(0.95);
        z-index: 2;
        opacity: 0.88;
        box-shadow: var(--shadow-deck);
      }
    }

    .form-card.anim-next-in {
      animation: cardStepToFront 0.62s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
      pointer-events: none;
    }

    @keyframes cardStepToFront {
      0% {
        transform: translate(14px, 8px) rotate(2deg) scale(0.988);
        z-index: 5;
        box-shadow: var(--shadow-deck);
      }
      35% {
        transform: translate(0, 0) rotate(0deg) scale(0.995);
        z-index: 10;
      }
      100% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        z-index: 10;
        box-shadow: var(--shadow-card);
      }
    }

    .form-card.anim-back-in {
      animation: cardSlideFromBackToFront 0.62s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
      pointer-events: none;
    }

    @keyframes cardSlideFromBackToFront {
      0% {
        transform: translate(26px, -14px) rotate(4.8deg) scale(0.95);
        z-index: 2;
        opacity: 0.88;
      }
      38% {
        transform: translate3d(-108%, 0, 0) rotate(0deg) scale(1.01);
        z-index: 12;
        box-shadow: var(--shadow-lifted);
        opacity: 1;
      }
      48% {
        z-index: 12;
      }
      100% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        z-index: 10;
        opacity: 1;
        box-shadow: var(--shadow-card);
      }
    }

    .form-card.anim-back-out {
      animation: cardFrontStepDownToStack 0.62s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
      pointer-events: none;
    }

    @keyframes cardFrontStepDownToStack {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        z-index: 9;
      }
      60% {
        transform: translate(0, 0) rotate(0deg) scale(0.995);
        z-index: 4;
      }
      100% {
        transform: translate(14px, 8px) rotate(2deg) scale(0.988);
        z-index: 4;
        box-shadow: var(--shadow-deck);
      }
    }

    /* Top Bar & Segmented Progress */
    .card-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .progress-track {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }
    .progress-pill {
      height: 4.5px;
      flex: 1;
      background: var(--progress-inactive);
      border-radius: 99px;
      position: relative;
      overflow: hidden;
      transition: background 0.3s ease;
    }
    .progress-pill-inner {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: var(--progress-active);
      border-radius: 99px;
      transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .progress-pill.completed .progress-pill-inner {
      width: 100%;
    }
    .progress-pill.active .progress-pill-inner {
      width: 100%;
      background: var(--progress-active);
    }

    .btn-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #edf3f7;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .btn-close:hover {
      background: #e2eaf0;
      color: var(--color-primary);
      transform: scale(1.08) rotate(90deg);
    }
    .btn-close svg {
      width: 14px;
      height: 14px;
    }

    /* Content Viewport with guaranteed scroll boundary */
    .question-viewport {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    .question-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .question-num {
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      color: var(--color-primary);
    }
    .step-badge {
      font-family: var(--font-mono);
      font-size: 10.5px;
      padding: 2px 8px;
      background: var(--color-primary-light);
      border-radius: 12px;
      color: var(--color-primary-dark);
      font-weight: 600;
    }

    .question-title {
      font-family: var(--font-heading);
      font-size: 23px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text-primary);
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .selection-instruction {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .selection-counter {
      background: var(--color-accent);
      color: var(--color-accent-dark);
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      border: 1px solid rgba(220, 95, 18, 0.2);
      transition: all 0.25s ease;
    }

    /* Options List */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 8px;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 4px 4px 2px; /* Clearance so top hover lift & shadow never clip */
    }
    .options-list::-webkit-scrollbar {
      width: 5px;
    }
    .options-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .options-list::-webkit-scrollbar-thumb {
      background: #cbd9e4;
      border-radius: 99px;
    }
    .options-list::-webkit-scrollbar-thumb:hover {
      background: var(--color-primary);
    }

    .option-item {
      position: relative;
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: #ffffff;
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-option);
      cursor: pointer;
      user-select: none;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 1px 3px rgba(19, 108, 158, 0.03);
      flex-shrink: 0;
    }

    .option-item:hover {
      background: var(--option-hover-bg);
      border-color: #b7d1e2;
      transform: translateY(-1.5px);
      box-shadow: 0 5px 14px rgba(19, 108, 158, 0.08);
    }

    .option-item:active {
      transform: scale(0.985);
    }

    .option-item.selected {
      background: var(--option-selected-bg);
      border-color: var(--option-selected-border);
      box-shadow: 0 5px 16px rgba(19, 108, 158, 0.12);
    }

    .indicator-box {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 2px solid #b2c9d8;
      margin-right: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #ffffff;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .option-item:hover .indicator-box {
      border-color: var(--color-primary);
    }

    .option-item.selected .indicator-box {
      background: var(--color-primary);
      border-color: var(--color-primary);
      transform: scale(1.1);
    }

    .indicator-dot {
      width: 7.5px;
      height: 7.5px;
      border-radius: 50%;
      background: var(--color-accent);
      opacity: 0;
      transform: scale(0.4);
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .option-item.selected .indicator-dot {
      opacity: 1;
      transform: scale(1);
    }

    .indicator-check {
      width: 12px;
      height: 12px;
      stroke: var(--color-accent);
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      transition: stroke-dashoffset 0.28s ease;
    }
    .option-item.selected .indicator-check {
      stroke-dashoffset: 0;
    }

    .option-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      flex: 1;
      line-height: 1.35;
    }

    .option-key-hint {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      border: 1px solid #d8e5ee;
      background: #fbfdfe;
      padding: 1px 6px;
      border-radius: 5px;
      opacity: 0;
      transform: translateX(4px);
      transition: all 0.2s ease;
    }
    .option-item:hover .option-key-hint {
      opacity: 1;
      transform: translateX(0);
    }

    /* Text Input */
    .text-input-wrapper {
      margin-bottom: 20px;
      position: relative;
    }
    .custom-textarea {
      width: 100%;
      height: 140px;
      padding: 16px;
      font-family: var(--font-body);
      font-size: 15.5px;
      font-weight: 500;
      color: var(--text-primary);
      background: #fafcfe;
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-option);
      resize: none;
      outline: none;
      transition: all 0.25s ease;
    }
    .custom-textarea:focus {
      background: #ffffff;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(19, 108, 158, 0.12);
    }
    .char-counter {
      display: flex;
      justify-content: flex-end;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-tertiary);
      margin-top: 8px;
    }
    .optional-skip-link {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-primary);
      text-decoration: underline;
      cursor: pointer;
      margin-top: 6px;
      display: inline-block;
      transition: color 0.2s ease;
    }
    .optional-skip-link:hover {
      color: var(--color-primary-dark);
    }

    /* Email Input */
    .email-input-wrapper {
      margin-bottom: 20px;
      position: relative;
    }
    .email-input-container {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .email-icon-prefix {
      position: absolute;
      left: 18px;
      color: #849aa8;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.22s ease;
    }
    .custom-input-email {
      width: 100%;
      height: 58px;
      padding: 0 18px 0 52px;
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      background: #fafcfe;
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-option);
      outline: none;
      transition: all 0.25s ease;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
    }
    .custom-input-email:focus {
      background: #ffffff;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(19, 108, 158, 0.12);
    }
    .email-input-container:focus-within .email-icon-prefix {
      color: var(--color-primary);
    }
    .email-hint-text {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    @keyframes subtleShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }
    .shake {
      animation: subtleShake 0.4s ease;
    }

    /* Footer Nav (Permanently anchored and visible) */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(19, 108, 158, 0.08);
      z-index: 10;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 16px;
      border-radius: var(--radius-btn);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-back:hover:not(:disabled) {
      background: #edf3f7;
      color: var(--color-primary);
    }
    .btn-back:disabled {
      opacity: 0;
      pointer-events: none;
    }

    .nav-right-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-next {
      background: var(--color-cta);
      color: #ffffff;
      border: none;
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 700;
      padding: 11px 26px;
      border-radius: var(--radius-btn);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--color-cta-shadow);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-next:hover:not(:disabled) {
      background: var(--color-cta-hover);
      transform: translateY(-1.5px);
      box-shadow: 0 6px 18px rgba(220, 95, 18, 0.55);
    }

    .btn-next:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-next:disabled {
      opacity: 0.35;
      background: #d8e2e9;
      color: #7b8e9b;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Ending Screen */
    .ending-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 6px 10px;
      flex: 1;
      justify-content: center;
      width: 100%;
    }

    .reward-illustration-wrapper {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounceIn 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes bounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .reward-illustration-img {
      height: 106px;
      width: auto;
      max-width: 125px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 20px rgba(19, 108, 158, 0.18));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .reward-illustration-img:hover {
      transform: scale(1.06) rotate(-2deg);
    }

    .ending-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font-heading);
      color: var(--color-primary-dark);
      background: var(--color-primary-light);
      border: 1px solid rgba(19, 108, 158, 0.2);
      padding: 4px 14px;
      border-radius: 99px;
      margin-bottom: 12px;
    }

    .ending-title {
      font-family: var(--font-heading);
      font-size: 25px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .ending-body {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-secondary);
      margin-bottom: 20px;
      max-width: 360px;
    }

    .reveal-stat-card {
      width: calc(100% - 12px);
      margin: 0 auto 20px;
      background: #ffffff;
      border: 1px solid #e1ecf4;
      border-radius: 16px;
      padding: 16px 18px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 20px -3px rgba(19, 108, 158, 0.1), 0 3px 8px -2px rgba(17, 34, 46, 0.04);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .reveal-stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -4px rgba(19, 108, 158, 0.16), 0 6px 12px -2px rgba(17, 34, 46, 0.08);
    }
    .stat-clock-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary);
      flex-shrink: 0;
    }
    .stat-title {
      font-family: var(--font-heading);
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }
    .stat-value {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.3;
    }
    .stat-highlight {
      color: var(--color-primary);
      font-weight: 800;
    }

    .btn-cta-primary {
      width: calc(100% - 12px);
      margin: 0 auto;
      background: var(--color-cta);
      color: #ffffff;
      border: none;
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: var(--radius-btn);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px var(--color-cta-shadow);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .btn-cta-primary:hover {
      background: var(--color-cta-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(220, 95, 18, 0.55);
    }

    .lead-tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      background: var(--color-primary-light);
      color: var(--color-primary-dark);
      border: 1px solid rgba(19, 108, 158, 0.18);
      padding: 4px 10px;
      border-radius: 6px;
      margin-top: 12px;
      font-family: var(--font-mono);
    }

    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }

    /* Responsive Adaptation: Stacked cards are clearly visible across all devices */
    @media (max-width: 640px) {
      body {
        padding: 20px 18px;
      }

      .deck-viewport {
        margin: 10px auto 16px;
        max-width: calc(100% - 30px);
        height: 600px;
      }

      .deck-layer-3 {
        transform: translate(16px, -10px) rotate(3.4deg) scale(0.96);
      }

      .deck-layer-2 {
        transform: translate(-14px, 10px) rotate(-2.6deg) scale(0.975);
      }

      .deck-layer-1 {
        transform: translate(10px, 6px) rotate(1.6deg) scale(0.99);
      }

      .form-card {
        padding: 20px 16px 16px;
        border-radius: 22px;
      }

      .question-title {
        font-size: 19.5px;
      }

      .option-item {
        padding: 9.5px 12px;
      }

      .option-label {
        font-size: 14px;
      }

      .options-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 8px;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 4px 4px 2px; /* Clearance so top hover lift & shadow never clip */
    }
    }
  </style>
</head>

              <div class="ending-badge">

              <h1 class="ending-title">Thanks, here's your reward.</h1>

              <div class="reveal-stat-card">
                <div class="stat-clock-icon">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

                  <div class="stat-title">Impact Forecast</div>

              <button class="btn-cta-primary" id="startTrialBtn">
                <span>Start your free trial</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </button>

              <div class="lead-tag-pill" title="Generated from Q1 & Q3/Q6 answers">
                <span>Profile: <strong>${state.profileTag}</strong></span>
                ${state.isPriorityLead ? '• <span style="color:#DC5F12;font-weight:800;">★ Priority Lead</span>' : ''}

        cardEl.querySelector('.btn-close').addEventListener('click', handleReset);
        cardEl.querySelector('#startTrialBtn').addEventListener('click', async () => {
          const btn = cardEl.querySelector('#startTrialBtn');
          btn.disabled = true;
          btn.innerHTML = '<span>Unlocking your reward...</span>';

          const payload = {
            email:         state.answers.q0 ? state.answers.q0.trim() : undefined,
            role:          state.answers.q1,
            propertyCount: state.answers.q2,
            timeSinks:     state.answers.q3 || [],
            adminHours:    state.answers.q5,
            biggestGain:   state.answers.q6,
            frustration:   state.answers.q7 || undefined,
            website:       '',
          };

          const roleStr = String(payload.role || '').toLowerCase();
          const roleIntent = (roleStr.includes('tenant') || roleStr.includes('renter')) ? 'tenant' : 'landlord';
          try {
            sessionStorage.setItem('proptii_signup_role_intent', roleIntent);
            sessionStorage.setItem('proptii_campaign_lead', JSON.stringify(payload));
            if (payload.email) {
              sessionStorage.setItem('pending_registration_email', payload.email);
            }
          } catch {}

          const apiBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? ''
            : 'https://proptii-r1-1a-1-hcw6.onrender.com';

          try {
            const res = await fetch(`${apiBase}/api/leads`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });

            if (res.ok) {
              const data = await res.json();
              if (data && data.token) {
                try {
                  sessionStorage.setItem('proptii_lead_token', data.token);
                  if (data.leadId) sessionStorage.setItem('proptii_lead_id', data.leadId);
                } catch {}
                const emailParam = payload.email ? `&email=${encodeURIComponent(payload.email)}` : '';
                window.location.href = `/welcome?token=${encodeURIComponent(data.token)}${emailParam}`;
                return;
              }
            }
          } catch (err) {
            console.error('Lead submission failed:', err);
          }

          // Fallback redirect if network fails
          const fallbackEmailParam = payload.email ? `?email=${encodeURIComponent(payload.email)}` : '';
          window.location.href = `/welcome${fallbackEmailParam}`;
        });

        launchConfetti();
        return;
      }

      const q = questionsData[stepIndex];

      let optionsHtml = '';
      if (q.type === 'single') {
        optionsHtml = `
          <div class="options-list">
            ${q.options.map((opt, i) => {
              const isSelected = state.answers[q.id] === opt;
              return `
                <div class="option-item ${isSelected ? 'selected' : ''}" data-value="${opt}" data-index="${i}">
                  <div class="indicator-box">
                    <div class="indicator-dot"></div>
                  </div>
                  <span class="option-label">${opt}</span>
                  <span class="option-key-hint">${i + 1}</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (q.type === 'multi') {
        const selectedArr = state.answers[q.id] || [];
        optionsHtml = `
          <div class="options-list" id="multiOptionsList">
            ${q.options.map((opt, i) => {
              const isSelected = selectedArr.includes(opt);
              return `
                <div class="option-item ${isSelected ? 'selected' : ''}" data-value="${opt}" data-index="${i}">
                  <div class="indicator-box">
                    <svg class="indicator-check" viewBox="0 0 24 24">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </div>
                  <span class="option-label">${opt}</span>
                  <span class="option-key-hint">${i + 1}</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (q.type === 'email') {
        const currentVal = state.answers[q.id] || '';
        optionsHtml = `
          <div class="email-input-wrapper">
            <div class="email-input-container">
              <span class="email-icon-prefix">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </span>
              <input 
                type="email" 
                class="custom-input-email" 
                placeholder="${q.placeholder}" 
                value="${currentVal}"
                autocomplete="email"
                spellcheck="false"
              />
            </div>
            <div class="email-hint-text">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#136C9E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
              <span>Instant VIP trial access &amp; reward will be dispatched here</span>
            </div>
          </div>
        `;
      } else if (q.type === 'text') {
        const currentVal = state.answers[q.id] || '';
        const remainingChars = q.maxChars - currentVal.length;
        optionsHtml = `
          <div class="text-input-wrapper">
            <textarea 
              class="custom-textarea" 
              placeholder="${q.placeholder}" 
              maxlength="${q.maxChars}">${currentVal}</textarea>
            <div class="char-counter">
              <span class="char-count-num">${remainingChars}</span> / ${q.maxChars} characters left
            </div>
            <div style="margin-top: 10px;">
              <span class="optional-skip-link">Skip this question &rarr;</span>
            </div>
          </div>
        `;
      }

      const progressBarsHtml = questionsData.map((_, idx) => {
        let cls = '';
        if (idx < stepIndex) cls = 'completed';
        else if (idx === stepIndex) cls = 'active';
        return `<div class="progress-pill ${cls}"><div class="progress-pill-inner"></div></div>`;
      }).join('');

      cardEl.innerHTML = `
        <div class="card-top-bar">
          <div class="progress-track" aria-label="Progress Tracker">
            ${progressBarsHtml}
          </div>
          <button class="btn-close" title="Restart questionnaire" aria-label="Restart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="question-viewport">
          <div class="question-meta">
            <span class="question-num">${q.badge}</span>
            <span class="step-badge">${stepIndex + 1} of ${questionsData.length}</span>
          </div>
          <h1 class="question-title">${q.title}</h1>
          <div class="selection-instruction" id="instructionBar">
            <span>${q.instruction}</span>
            ${q.type === 'multi' ? `<span class="selection-counter">${(state.answers[q.id] || []).length} / ${q.maxSelect} SELECTED</span>` : ''}
          </div>
          ${optionsHtml}
        </div>

        <footer class="card-footer">
          <button class="btn-back" ${stepIndex === 0 ? 'disabled' : ''}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Back
          </button>

          <div class="nav-right-actions">
            <button class="btn-next" disabled>
              <span>Next</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
        </footer>
      `;

      const nextBtn = cardEl.querySelector('.btn-next');
      const backBtn = cardEl.querySelector('.btn-back');
      const closeBtn = cardEl.querySelector('.btn-close');

      closeBtn.addEventListener('click', handleReset);
      backBtn.addEventListener('click', triggerTransitionBack);
      nextBtn.addEventListener('click', triggerTransitionNext);

      function updateNextState() {
        if (!q.required) {
          nextBtn.disabled = false;
          return;
        }
        if (q.type === 'email') {
          const emailVal = (state.answers[q.id] || '').trim();
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          nextBtn.disabled = !emailRegex.test(emailVal);
        } else if (q.type === 'single') {
          nextBtn.disabled = !state.answers[q.id];
        } else if (q.type === 'multi') {
          const sel = state.answers[q.id] || [];
          nextBtn.disabled = sel.length === 0;
        } else {
          nextBtn.disabled = false;
        }
      }

      if (q.type === 'email') {
        const emailInput = cardEl.querySelector('.custom-input-email');
        if (emailInput) {
          setTimeout(() => {
            emailInput.focus();
            if (emailInput.value) {
              emailInput.setSelectionRange(emailInput.value.length, emailInput.value.length);
            }
          }, 120);

          emailInput.addEventListener('input', (e) => {
            state.answers[q.id] = e.target.value.trim();
            updateNextState();
          });

          emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              if (!nextBtn.disabled) {
                nextBtn.click();
              }
            }
          });
        }
      } else if (q.type === 'single') {
        const items = cardEl.querySelectorAll('.option-item');
        items.forEach(item => {
          item.addEventListener('click', () => {
            items.forEach(i => i.classList.remove('selected'));
            item.classList.add('selected');
            state.answers[q.id] = item.getAttribute('data-value');
            updateNextState();
          });
        });
      } else if (q.type === 'multi') {
        const items = cardEl.querySelectorAll('.option-item');
        const counter = cardEl.querySelector('.selection-counter');
        items.forEach(item => {
          item.addEventListener('click', () => {
            const val = item.getAttribute('data-value');
            let selectedArr = state.answers[q.id] || [];

            if (selectedArr.includes(val)) {
              selectedArr = selectedArr.filter(v => v !== val);
              item.classList.remove('selected');
            } else {
              if (selectedArr.length >= q.maxSelect) {
                const bar = cardEl.querySelector('#instructionBar');
                bar.classList.remove('shake');
                void bar.offsetWidth;
                bar.classList.add('shake');
                return;
              }
              selectedArr.push(val);
              item.classList.add('selected');
            }

            state.answers[q.id] = selectedArr;
            counter.textContent = `${selectedArr.length} / ${q.maxSelect} SELECTED`;
            updateNextState();
          });
        });
      } else if (q.type === 'text') {
        const textarea = cardEl.querySelector('.custom-textarea');
        const charCount = cardEl.querySelector('.char-count-num');
        const skipLink = cardEl.querySelector('.optional-skip-link');

        textarea.focus();
        textarea.addEventListener('input', (e) => {
          state.answers[q.id] = e.target.value;
          charCount.textContent = q.maxChars - e.target.value.length;
          updateNextState();
        });

        skipLink.addEventListener('click', () => {
          state.answers[q.id] = '';
          triggerTransitionNext();
        });
      }

      updateNextState();
    }

    function triggerTransitionNext() {
      if (isTransitioning || state.currentStep >= questionsData.length) return;
      isTransitioning = true;

      const nextStep = state.currentStep + 1;
      renderCardDOM(stagedCardEl, nextStep);

      activeCardEl.className = 'form-card anim-next-out';
      stagedCardEl.className = 'form-card anim-next-in';

      setTimeout(() => {
        state.currentStep = nextStep;

        activeCardEl.className = 'form-card is-staged';
        stagedCardEl.className = 'form-card is-active';

        const temp = activeCardEl;
        activeCardEl = stagedCardEl;
        stagedCardEl = temp;

        isTransitioning = false;
      }, 620);
    }

    function triggerTransitionBack() {
      if (isTransitioning || state.currentStep <= 0) return;
      isTransitioning = true;

      const prevStep = state.currentStep - 1;
      renderCardDOM(stagedCardEl, prevStep);

      stagedCardEl.className = 'form-card anim-back-in';
      activeCardEl.className = 'form-card anim-back-out';

      setTimeout(() => {
        state.currentStep = prevStep;

        stagedCardEl.className = 'form-card is-active';
        activeCardEl.className = 'form-card is-staged';

        const temp = activeCardEl;
        activeCardEl = stagedCardEl;
        stagedCardEl = temp;

        isTransitioning = false;
      }, 620);
    }

    function handleReset() {
      if (confirm('Start questionnaire from the beginning?')) {
        state.currentStep = 0;
        state.answers = { q0: '', q1: null, q2: null, q3: [], q5: null, q6: null, q7: '' };
        renderCardDOM(activeCardEl, 0);
      }
    }

    function processFormLogic() {
      state.segment = state.answers.q1 || 'Property Professional';
      state.portfolio_size = state.answers.q2 || 'Standard';

      const highVolume = ['6–20', '21–50', '51–100', '100+'].includes(state.answers.q2);
      const isAgentOrManager = ['Estate agent / letting agent', 'Property manager'].includes(state.answers.q1);
      state.isPriorityLead = highVolume && isAgentOrManager;

      const hoursMap = {
        'Less than 2 hours': '50–100',
        '2–5 hours': '100–250',
        '5–10 hours': '250–500',
        '10–20 hours': '500–1,000',
        '20+ hours': 'over 1,000+'
      };
      state.annualSavedHoursRange = hoursMap[state.answers.q5] || '100–250';
      state.annualSavedHoursText = `${state.annualSavedHoursRange} hours a year`;

      const q3Answers = state.answers.q3 || [];
      const q6Answer = state.answers.q6 || '';

      if (q3Answers.includes('Chasing people (applicants, tenants, owners)') || 
          q3Answers.includes('Keeping systems and chats updated') || 
          q6Answer === 'Routine communication') {
        state.profileTag = 'Communication Firefighter';
      } else if (q6Answer === 'Qualify applicants automatically' || q3Answers.includes('Referencing and documents')) {
        state.profileTag = 'Leasing Automator';
      } else if (q3Answers.includes('Compliance') || q6Answer === 'Compliance') {
        state.profileTag = 'Compliance Sentinel';
      } else if (q3Answers.includes('Maintenance and repairs') || q6Answer === 'Maintenance tracking') {
        state.profileTag = 'Operations Streamliner';
      } else {
        state.profileTag = 'Property Efficiency Leader';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#DC5F12', '#136C9E', '#FADB9D', '#f47e38', '#ffffff', '#2c8cb8'];

      for (let i = 0; i < 80; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2 + 40,
          w: Math.random() * 9 + 4,
          h: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.85) * 19,
          rotation: Math.random() * 360,
          rSpeed: (Math.random() - 0.5) * 12,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.01
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = 0;

        particles.forEach(p => {
          if (p.alpha > 0) {
            active++;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.36;
            p.rotation += p.rSpeed;
            p.alpha -= p.decay;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          }
        });

        if (active > 0) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      render();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
