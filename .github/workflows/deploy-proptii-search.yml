name: Deploy Proptii Search to Azure

on:
  push:
    branches: [ main, new-staging-branch ]
    paths:
      - 'proptii-search/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: proptii-search/package-lock.json

      - name: Install Dependencies
        run: |
          cd proptii-search
          npm ci

      - name: Build
        run: |
          cd proptii-search
          npm run build

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'proptii-search' # User will likely need to adjust this or use a secret
          publish-profile: ${{ secrets.AZURE_PROPTII_SEARCH_PUBLISH_PROFILE }}
          package: './proptii-search'
