<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proptii — Get set up</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,500;6..12,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="flow-shared.css">
<style>
.dim-bg { position: fixed; inset: 0; background: rgba(14,43,71,0.55); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: #fff; width: 480px; max-width: 100%; border-radius: 24px; padding: 36px 36px 28px; position: relative; animation: pop .35s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pop { from { opacity:0; transform: translateY(12px) scale(.96); } to { opacity:1; transform: translateY(0) scale(1); } }
.modal-close { position: absolute; top: 18px; right: 18px; width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--cream); color: var(--navy); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: background .15s; }
.modal-close:hover { background: var(--cream-deep); }
.eyebrow { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--orange); background: var(--orange-light); padding: 5px 12px; border-radius: 20px; margin-bottom: 14px; }
.modal h2 { font-family: 'Archivo', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px; }
.modal .lead { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
.google-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 13px; border: 1.5px solid var(--border-strong); border-radius: 30px; background: #fff; color: var(--navy); font-size: 15px; font-weight: 600; cursor: pointer; transition: border-color .15s, transform .15s; }
.google-btn:hover { border-color: var(--navy); transform: translateY(-1px); }
.google-btn svg { width: 18px; height: 18px; }
.divider-or { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.divider-or::before, .divider-or::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.email-input { width: 100%; padding: 13px 16px; border: 1.5px solid var(--border-strong); border-radius: 30px; font-family: inherit; font-size: 15px; margin-bottom: 10px; transition: border-color .15s, box-shadow .15s; }
.email-input:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 4px rgba(232,98,42,.12); }
.modal .signin-link { text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px; }
.modal .signin-link a { color: var(--orange); text-decoration: none; font-weight: 600; }
.modal .footnote { text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 6px; }
.modal .footnote svg { width: 12px; height: 12px; color: var(--green); }

/* Dimmed pricing peek behind */
.peek { position: fixed; inset: 0; background: var(--cream); z-index: 1; opacity: .4; pointer-events: none; padding: 80px 60px; }
.peek h1 { font-family: 'Archivo'; font-size: 56px; font-weight: 800; text-align: center; color: var(--navy); margin-top: 80px; }
.peek .row { display: flex; gap: 20px; max-width: 1080px; margin: 60px auto; }
.peek .card { flex: 1; height: 380px; background: #fff; border: 1px solid var(--border); border-radius: 24px; }
.peek .card.mid { border: 2px solid var(--green-dark); }
</style></head><body>

<div class="peek" aria-hidden="true">
  <h1>The right plan for every move.</h1>
  <div class="row"><div class="card"></div><div class="card mid"></div><div class="card"></div></div>
</div>

<div class="dim-bg">
  <div class="modal" role="dialog" aria-labelledby="modalTitle">
    <button class="modal-close" aria-label="Close" onclick="history.back()">×</button>
    <div class="eyebrow">You chose Renter Pro</div>
    <h2 id="modalTitle">Let's get you set up.</h2>
    <p class="lead">Your free month starts the moment you're in.</p>

    <button class="google-btn">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div class="divider-or">or</div>

    <input class="email-input" type="email" placeholder="Your email address" data-flow-bind="email" autofocus>
    <a href="screen-3-account.html" class="btn btn-primary btn-block" style="border-radius:30px">Continue with email</a>

    <p class="signin-link">Already have an account? <a href="#">Sign in instead →</a></p>

    <div class="footnote">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="2,6 5,9 10,3"/></svg>
      Free month starts immediately. No card needed today.
    </div>
  </div>
</div>

<script src="flow-partials.js"></script>
<script>
  flowBind();
  flowTimeout();
</script>

</body></html>
