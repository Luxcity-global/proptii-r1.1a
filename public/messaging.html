<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proptii Messaging Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; height: 100vh; display: flex; flex-direction: column; }

    /* ── Top bar ── */
    #topbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #topbar h1 { font-size: 1rem; font-weight: 700; color: #111827; flex: 1; }
    #topbar .badge { font-size: 0.75rem; background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 99px; font-weight: 600; }

    /* ── Auth bar ── */
    #authbar {
      background: #1e293b;
      color: #f1f5f9;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    #authbar span { color: #94a3b8; }
    #authbar strong { color: #86efac; }
    .auth-btn {
      padding: 4px 12px; border-radius: 6px; border: none; cursor: pointer;
      font-size: 0.78rem; font-weight: 600; color: #fff;
    }
    #btn-landlord { background: #1d4ed8; }
    #btn-tenant   { background: #15803d; }
    #btn-logout   { background: #dc2626; }

    /* ── Main layout ── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar {
      width: 300px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #sidebar-header {
      padding: 14px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      color: #111827;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    #conv-list { flex: 1; overflow-y: auto; }
    .conv-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
      transition: background 0.1s;
    }
    .conv-item:hover { background: #f9fafb; }
    .conv-item.active { background: #eff6ff; border-left: 3px solid #3b82f6; }
    .conv-item .prop { font-size: 0.75rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px; }
    .conv-item .preview { font-size: 0.82rem; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-item .time { font-size: 0.7rem; color: #9ca3af; margin-top: 2px; }
    #empty-convs { padding: 40px 16px; text-align: center; color: #9ca3af; font-size: 0.85rem; }

    /* ── Thread ── */
    #thread-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }
    #thread-header {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 600;
      font-size: 0.9rem;
      color: #111827;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #thread-header .unread-badge {
      background: #ef4444; color: #fff; font-size: 0.7rem;
      padding: 1px 7px; border-radius: 99px; font-weight: 700;
    }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 0.875rem; line-height: 1.4; word-break: break-word; }
    .msg.from-me { align-self: flex-end; background: #3b82f6; color: #fff; border-bottom-right-radius: 3px; }
    .msg.from-other { align-self: flex-start; background: #f3f4f6; color: #111827; border-bottom-left-radius: 3px; }
    .msg .meta { font-size: 0.68rem; margin-top: 4px; opacity: 0.7; }
    .msg.from-me .meta { text-align: right; }
    #no-conv { flex: 1; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 0.9rem; }

    /* ── Compose ── */
    #compose {
      border-top: 1px solid #e5e7eb;
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      background: #fff;
    }
    #compose textarea {
      flex: 1; border: 1px solid #d1d5db; border-radius: 8px;
      padding: 8px 12px; font-size: 0.875rem; resize: none;
      font-family: inherit; outline: none; height: 40px; max-height: 120px;
    }
    #compose textarea:focus { border-color: #3b82f6; }
    #send-btn {
      background: #3b82f6; color: #fff; border: none; border-radius: 8px;
      padding: 0 18px; cursor: pointer; font-weight: 600; font-size: 0.875rem;
    }
    #send-btn:disabled { background: #93c5fd; cursor: not-allowed; }

    /* ── Status bar ── */
    #statusbar {
      background: #f9fafb; border-top: 1px solid #e5e7eb;
      padding: 4px 16px; font-size: 0.72rem; color: #6b7280;
      flex-shrink: 0;
    }
    .err { color: #dc2626; }
    .ok  { color: #16a34a; }

    /* ── New conversation panel ── */
    #new-conv-panel {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      background: #f9fafb;
      flex-shrink: 0;
    }
    #new-conv-panel input {
      width: 100%; border: 1px solid #d1d5db; border-radius: 6px;
      padding: 6px 10px; font-size: 0.8rem; margin-bottom: 6px; outline: none;
    }
    #new-conv-panel input:focus { border-color: #3b82f6; }
    #new-conv-btn {
      width: 100%; background: #1d4ed8; color: #fff; border: none;
      border-radius: 6px; padding: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 600;
    }
  </style>
</head>
<body>

<div id="topbar">
  <h1>💬 Proptii Messaging</h1>
  <span class="badge" id="unread-badge" style="display:none"></span>
  <span style="font-size:0.75rem;color:#6b7280">API: <code id="api-url"></code></span>
</div>

<div id="authbar">
  <span>Signed in as:</span>
  <strong id="auth-name">Not signed in</strong>
  <button class="auth-btn" id="btn-landlord">Login as Landlord</button>
  <button class="auth-btn" id="btn-tenant">Login as Tenant</button>
  <button class="auth-btn" id="btn-logout" style="display:none">Sign out</button>
</div>

<div id="main">
  <div id="sidebar">
    <div id="sidebar-header">Conversations</div>

    <div id="new-conv-panel">
      <input id="new-prop-id" placeholder="Property ID (e.g. property-test-001)" value="property-test-001" />
      <button id="new-conv-btn">+ New Conversation</button>
    </div>

    <div id="conv-list">
      <div id="empty-convs">Sign in to load conversations</div>
    </div>
  </div>

  <div id="thread-panel">
    <div id="no-conv">Select a conversation</div>
    <div id="thread-header" style="display:none">
      <span id="thread-title"></span>
      <span class="unread-badge" id="thread-unread" style="display:none"></span>
    </div>
    <div id="messages" style="display:none"></div>
    <div id="compose" style="display:none">
      <textarea id="msg-input" placeholder="Type a message…" rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>

<div id="statusbar"><span id="status">Ready</span></div>

<script>
  const API = 'http://localhost:7071/api/communication';
  document.getElementById('api-url').textContent = API;

  // ── State ──────────────────────────────────────────────────────────────────
  let currentUser = null;   // { id, name, role }
  let conversations = [];
  let activeConvId = null;
  let pollTimer = null;

  // ── Auth ───────────────────────────────────────────────────────────────────
  const MOCK_USERS = {
    landlord: { id: 'landlord-test-001', name: 'Test Landlord', role: 'landlord' },
    tenant:   { id: 'tenant-test-001',   name: 'Test Tenant',   role: 'tenant'   },
  };

  function token() {
    return currentUser ? `mock-token-${currentUser.id}` : null;
  }

  function headers() {
    const h = { 'Content-Type': 'application/json' };
    if (token()) h['Authorization'] = `Bearer ${token()}`;
    return h;
  }

  function login(role) {
    currentUser = MOCK_USERS[role];
    document.getElementById('auth-name').textContent = currentUser.name;
    document.getElementById('btn-logout').style.display = 'inline-block';
    setStatus(`Signed in as ${currentUser.name}`, 'ok');
    loadConversations();
    startPolling();
  }

  function logout() {
    currentUser = null;
    conversations = [];
    activeConvId = null;
    stopPolling();
    document.getElementById('auth-name').textContent = 'Not signed in';
    document.getElementById('btn-logout').style.display = 'none';
    renderConversations();
    showNoConv();
    setStatus('Signed out');
  }

  document.getElementById('btn-landlord').onclick = () => login('landlord');
  document.getElementById('btn-tenant').onclick   = () => login('tenant');
  document.getElementById('btn-logout').onclick   = logout;

  // ── API calls ──────────────────────────────────────────────────────────────
  async function apiFetch(path, opts = {}) {
    const res = await fetch(API + path, { headers: headers(), ...opts });
    const json = await res.json();
    if (!res.ok) throw new Error(json?.error?.message || `HTTP ${res.status}`);
    return json.data;
  }

  async function loadConversations() {
    if (!currentUser) return;
    try {
      setStatus('Loading conversations…');
      conversations = await apiFetch('/conversations');
      renderConversations();
      updateUnreadBadge();
      setStatus(`${conversations.length} conversation(s) loaded`, 'ok');
    } catch (e) {
      setStatus('Error loading conversations: ' + e.message, 'err');
    }
  }

  async function loadMessages(convId) {
    try {
      setStatus('Loading messages…');
      const msgs = await apiFetch(`/conversations/${convId}/messages`);
      renderMessages(msgs, convId);
      setStatus(`${msgs.length} message(s)`, 'ok');
    } catch (e) {
      setStatus('Error loading messages: ' + e.message, 'err');
    }
  }

  async function sendMessage() {
    if (!activeConvId || !currentUser) return;
    const input = document.getElementById('msg-input');
    const body = input.value.trim();
    if (!body) return;

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    input.value = '';

    const conv = conversations.find(c => c.id === activeConvId);
    const recipientId = currentUser.role === 'landlord' ? conv?.tenantId : conv?.landlordId;

    try {
      const msg = await apiFetch(`/conversations/${activeConvId}/messages`, {
        method: 'POST',
        body: JSON.stringify({ body, senderRole: currentUser.role, recipientId }),
      });
      // Append optimistically
      appendMessage(msg);
      scrollToBottom();
      setStatus('Message sent', 'ok');
      // Refresh conversations to update lastMessageAt
      loadConversations();
    } catch (e) {
      setStatus('Send failed: ' + e.message, 'err');
      input.value = body; // restore
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  async function createConversation() {
    if (!currentUser) { setStatus('Sign in first', 'err'); return; }
    const propId = document.getElementById('new-prop-id').value.trim();
    if (!propId) { setStatus('Enter a property ID', 'err'); return; }

    const landlordId = currentUser.role === 'landlord' ? currentUser.id : 'landlord-test-001';
    const tenantId   = currentUser.role === 'tenant'   ? currentUser.id : 'tenant-test-001';

    try {
      setStatus('Creating conversation…');
      const conv = await apiFetch('/conversations', {
        method: 'POST',
        body: JSON.stringify({ propertyId: propId, tenantId, landlordId }),
      });
      setStatus('Conversation ready', 'ok');
      await loadConversations();
      selectConversation(conv.id);
    } catch (e) {
      setStatus('Error: ' + e.message, 'err');
    }
  }

  async function updateUnreadBadge() {
    if (!currentUser) return;
    try {
      const result = await apiFetch('/conversations/unread-count');
      const count = typeof result === 'object' ? result.unreadCount : result;
      const badge = document.getElementById('unread-badge');
      if (count > 0) {
        badge.textContent = `${count} unread`;
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }
    } catch (_) {}
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderConversations() {
    const list = document.getElementById('conv-list');
    if (!conversations.length) {
      list.innerHTML = '<div id="empty-convs">No conversations yet.<br>Use the form above to create one.</div>';
      return;
    }
    list.innerHTML = conversations.map(c => `
      <div class="conv-item ${c.id === activeConvId ? 'active' : ''}" data-id="${c.id}">
        <div class="prop">${c.propertyId}</div>
        <div class="preview">${c.tenantId} ↔ ${c.landlordId}</div>
        <div class="time">${c.lastMessageAt ? new Date(c.lastMessageAt).toLocaleString() : 'No messages yet'}</div>
      </div>
    `).join('');
    list.querySelectorAll('.conv-item').forEach(el => {
      el.onclick = () => selectConversation(el.dataset.id);
    });
  }

  function selectConversation(id) {
    activeConvId = id;
    renderConversations(); // re-render to update active state
    const conv = conversations.find(c => c.id === id);
    document.getElementById('thread-header').style.display = 'flex';
    document.getElementById('thread-title').textContent = conv?.propertyId ?? id;
    document.getElementById('messages').style.display = 'flex';
    document.getElementById('compose').style.display = 'flex';
    document.getElementById('no-conv').style.display = 'none';
    loadMessages(id);
  }

  function renderMessages(msgs, convId) {
    const container = document.getElementById('messages');
    if (!msgs.length) {
      container.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:20px;font-size:0.85rem">No messages yet. Send the first one!</div>';
      return;
    }
    container.innerHTML = msgs.map(m => {
      const isMe = currentUser && m.senderId === currentUser.id;
      const time = new Date(m.sentAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const read = m.readAt ? '✓✓' : '✓';
      return `
        <div class="msg ${isMe ? 'from-me' : 'from-other'}">
          ${!isMe ? `<div style="font-size:0.7rem;font-weight:700;margin-bottom:3px;color:#6b7280">${m.senderRole}</div>` : ''}
          ${escHtml(m.body)}
          <div class="meta">${time} ${isMe ? read : ''}</div>
        </div>
      `;
    }).join('');
    scrollToBottom();
  }

  function appendMessage(msg) {
    const container = document.getElementById('messages');
    // Remove "no messages" placeholder if present
    const placeholder = container.querySelector('div[style*="No messages"]');
    if (placeholder) placeholder.remove();

    const isMe = currentUser && msg.senderId === currentUser.id;
    const time = new Date(msg.sentAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const el = document.createElement('div');
    el.className = `msg ${isMe ? 'from-me' : 'from-other'}`;
    el.innerHTML = `${escHtml(msg.body)}<div class="meta">${time} ✓</div>`;
    container.appendChild(el);
  }

  function showNoConv() {
    document.getElementById('no-conv').style.display = 'flex';
    document.getElementById('thread-header').style.display = 'none';
    document.getElementById('messages').style.display = 'none';
    document.getElementById('compose').style.display = 'none';
  }

  function scrollToBottom() {
    const c = document.getElementById('messages');
    c.scrollTop = c.scrollHeight;
  }

  function setStatus(msg, type = '') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = type;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Send on Enter (Shift+Enter for newline) ────────────────────────────────
  document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  document.getElementById('send-btn').onclick = sendMessage;
  document.getElementById('new-conv-btn').onclick = createConversation;

  // ── Polling ────────────────────────────────────────────────────────────────
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(async () => {
      await loadConversations();
      if (activeConvId) await loadMessages(activeConvId);
    }, 15000);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // Refresh on tab focus
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && currentUser) {
      loadConversations();
      if (activeConvId) loadMessages(activeConvId);
    }
  });
</script>
</body>
</html>
