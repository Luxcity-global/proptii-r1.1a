services:
  # ─── Proptii Frontend (Static Site) ─────────────────────────────────────────
  - type: web
    name: proptii-frontend
    runtime: static
    repo: https://github.com/Luxcity-global/proptii-r1.1a
    branch: feature/search
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: VITE_ENVIRONMENT
        value: production
      - key: VITE_APP_URL
        value: https://proptii-frontend-pweq.onrender.com
      - key: VITE_API_URL
        value: https://proptii-v2-backend.onrender.com/api
      - key: VITE_API_BASE_URL
        value: https://proptii-v2-backend.onrender.com/api
      - key: VITE_NEST_API_ENDPOINT
        value: https://proptii-v2-backend.onrender.com
      - key: VITE_SEARCH_BACKEND_URL
        value: https://proptii-feed-api.onrender.com
      - key: VITE_USE_REMOTE_API
        value: "true"
      - key: VITE_USE_LOCAL_SEARCH
        value: "false"
      - key: VITE_GOV_DATA_LAYER
        value: "true"
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyC0UZxzkhsebn-gSuo7HDRGVid30URQVvA
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: proptii-16946.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: proptii-16946
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: proptii-16946.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "423487822587"
      - key: VITE_FIREBASE_APP_ID
        value: 1:423487822587:web:9fd069dd01ec5e8267ae5e
      - key: VITE_FIREBASE_MEASUREMENT_ID
        value: G-88HC0TG6JJ
      - key: VITE_GOOGLE_MAPS_API_KEY
        value: AIzaSyChXxNp1xBJtJB9pC5WxWoZw3__7nT3djU
      - key: VITE_GA_MEASUREMENT_ID
        value: G-88HC0TG6JJ
      - key: VITE_ADMIN_EMAILS
        value: miracle.ohuka@theluxcity.co.uk, bolu.o@theluxcity.co.uk, tosin@theluxcity.co.uk
      - key: VITE_ADMIN_EMAIL_DOMAINS
        value: proptii.com,proptii.co,theluxcity.co.uk

  # ─── Proptii Core Backend (NestJS Web Service) ──────────────────────────────
  - type: web
    name: proptii-v2-backend
    runtime: node
    repo: https://github.com/Luxcity-global/proptii-r1.1a
    branch: feature/search
    region: frankfurt
    plan: free
    rootDir: v2-backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: BACKEND_URL
        value: https://proptii-v2-backend.onrender.com
      - key: FRONTEND_URL
        value: https://proptii-frontend-pweq.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://proptii.co,https://www.proptii.co,https://proptii-frontend-pweq.onrender.com,https://proptii-frontend.onrender.com
      - key: FIREBASE_PROJECT_ID
        value: proptii-16946
      - key: FIREBASE_STORAGE_BUCKET
        value: proptii-16946.firebasestorage.app
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: noreply@mail.proptii.co
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        value: miracle.ohuka@theluxcity.co.uk, bolu.o@theluxcity.co.uk, tosin@theluxcity.co.uk
      - key: ADMIN_EMAIL_DOMAINS
        value: proptii.com,proptii.co,theluxcity.co.uk
      - key: REDIS_URL
        value: redis://red-dar5opnavr4c73fsdlk0:6379
      - key: EPC_INGEST_ENABLED
        value: "false"

  # ─── Proptii Search Service (Node/Express Scraper & Search) ─────────────────
  - type: web
    name: proptii-feed-api
    runtime: node
    repo: https://github.com/Luxcity-global/proptii-r1.1a
    branch: feature/search
    region: frankfurt
    plan: free
    rootDir: proptii-search
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        value: redis://red-dar5opnavr4c73fsdlk0:6379
      - key: BRAVE_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: contactus@theluxcity.co.uk
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        value: contactus@theluxcity.co.uk
      - key: FRONTEND_URL
        value: https://proptii-frontend-pweq.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://proptii.co,https://www.proptii.co,https://proptii-frontend-pweq.onrender.com,https://proptii-frontend.onrender.com
