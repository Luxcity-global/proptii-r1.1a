    headers:
      # ── COOP: same-origin-allow-popups ──────────────────────────────────────
      # Required for MSAL popup flows (editProfile, acquireTokenPopup).
      # "same-origin-allow-popups" lets our origin open popups to B2C while still
      # blocking malicious cross-origin window references. Without this header,
      # B2C's own "same-origin" COOP response nullifies window.opener on the
      # popup's return trip, causing MSAL to throw BrowserAuthError with an empty
      # .message — the exact crash that rendered "Something went wrong / Error".
      # Note: login() and logout() use redirect flows (not popups), so this header
      # is defence-in-depth for editProfile and any future popup calls.
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: "1; mode=block"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://*.onrender.com https://proptii-r1-1a-1-hcw6.onrender.com https://proptii-r1-1a-q95f.onrender.com https://*.firebaseapp.com wss://*.firebaseio.com https://*.googleapis.com https://*.firestore.googleapis.com https://formsubmit.co https://api.proptii.com https://api-staging.proptii.com https://*.azure.com https://*.openai.azure.com https://proptii.b2clogin.com https://proptii.co https://www.proptii.co https://*.cognitiveservices.azure.com https://*.railway.app http://localhost:10000 http://localhost:3000; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://proptii.b2clogin.com https://www.googletagmanager.com https://*.googleapis.com https://apis.google.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; frame-src 'self' https://proptii-16946.firebaseapp.com https://*.firebaseapp.com https://proptii.b2clogin.com https://*.google.com https://apis.google.com https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://*.stripe.com; frame-ancestors 'none';"
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /landlord/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    # SPA routing — Render matches /* (not /**) per https://render.com/docs/redirects-rewrites
    routes:
      - type: rewrite
        source: /assets/*
        destination: /assets/:splat
      - type: rewrite
        source: /static/*
        destination: /static/:splat
      - type: rewrite
        source: /landlord/assets/*
        destination: /landlord/assets/:splat
      - type: rewrite
        source: /landlord/*
        destination: /landlord/index.html
      - type: rewrite
        source: /billing/*
        destination: /index.html
      - type: rewrite
        source: /signup/*
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html

