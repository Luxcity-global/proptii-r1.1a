services:
  # Frontend (Vite)
  - type: web
    name: proptii-frontend
    # Blueprint: static sites use runtime: static (SPA rewrites below require this service type)
    runtime: static
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    previews:
      generation: automatic
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_APP_ENV
        value: production
      # Update with your custom hosted backend URL on Render (e.g. https://your-backend.onrender.com/api)
      - key: VITE_API_URL
        value: https://proptii-backend.onrender.com/api
      - key: VITE_AZURE_OPENAI_API_KEY
        sync: false
      - key: VITE_AZURE_OPENAI_ENDPOINT
        sync: false
      - key: VITE_AZURE_OPENAI_DEPLOYMENT_NAME
        sync: false
      # Update with your custom hosted backend sheets URL on Render (e.g. https://your-backend.onrender.com/api/sheets)
      - key: VITE_GOOGLE_SHEETS_API_ENDPOINT
        value: https://proptii-backend.onrender.com/api/sheets
      # Update with your custom hosted search URL on Render (e.g. https://your-search-backend.onrender.com)
      - key: VITE_SEARCH_BACKEND_URL
        value: https://proptii-search-backend.onrender.com
      - key: VITE_GA_MEASUREMENT_ID
        value: G-88HC0TG6JJ
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: "1; mode=block"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://formsubmit.co https://*.onrender.com https://*.azure.com https://*.azurewebsites.net https://*.openai.azure.com https://proptii.b2clogin.com https://proptii.co https://*.cognitiveservices.azure.com https://*.railway.app http://localhost:10000/api/*; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://proptii.b2clogin.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; frame-ancestors 'none';"
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # SPA: rewrite unknown paths to index.html so hard refresh works on client routes.
    # Render matches /* (not /**) per https://render.com/docs/redirects-rewrites
    routes:
      - type: rewrite
        source: /assets/*
        destination: /assets/:splat
      - type: rewrite
        source: /static/*
        destination: /static/:splat
      # Landlord sub-app (basename /landlord)
      - type: rewrite
        source: /landlord/*
        destination: /landlord/index.html
      # Main Vite app — must be last
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend (NestJS)
  - type: web
    name: proptii-backend
    env: node
    plan: free
    buildCommand: cd proptii-backend && npm install --include=dev && npm run build
    startCommand: cd proptii-backend && npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: FRONTEND_URL
        value: https://proptii.co
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT_NAME
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS_JSON
        sync: false

  # Search Backend (Express)
  - type: web
    name: proptii-search-backend
    env: node
    plan: free
    buildCommand: cd proptii-search && npm install --include=dev && npm run build
    startCommand: cd proptii-search && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
