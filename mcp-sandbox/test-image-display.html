<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Display Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-image { width: 300px; height: 200px; object-fit: cover; border-radius: 8px; margin: 10px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Image Display Test</h1>
    <div id="status"></div>
    <div id="images"></div>

    <script>
        const testImageUrl = 'https://imagescdn.openrent.co.uk/listings/2430557/o_1ip5f5d32lg81ig1l4oqlh1pdq9.JPG_homepage.JPG';
        
        function updateStatus(message, isSuccess = true) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status ${isSuccess ? 'success' : 'error'}">${message}</div>`;
        }

        function testImageLoad() {
            const img = new Image();
            img.className = 'test-image';
            img.alt = 'Test property image';
            
            img.onload = function() {
                updateStatus('✅ Image loaded successfully!', true);
                document.getElementById('images').appendChild(img);
            };
            
            img.onerror = function() {
                updateStatus('❌ Image failed to load', false);
            };
            
            img.src = testImageUrl;
        }

        // Test the image
        updateStatus('🔄 Testing image load...', true);
        testImageLoad();
    </script>
</body>
</html>
