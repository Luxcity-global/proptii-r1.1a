<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zoopla Search Results Fixture</title>
</head>
<body>
  <div data-testid="listing-details">
    <div data-testid="listing-title">2 bed flat to rent in London</div>
    <div data-testid="listing-price">£2,000 pcm</div>
    <div data-testid="listing-address">123 Main Street, London, W1A 1AA</div>
    <div data-testid="listing-description">A beautiful 2 bedroom flat in central London.</div>
    <a href="/to-rent/details/12345678/">View details</a>
    <img data-testid="listing-image" src="https://images.zoopla.co.uk/123.jpg" alt="Flat image" />
    <span>2 bed</span>
    <span>1 bath</span>
    <span>Flat</span>
    <div data-testid="agent-name">Best Agents Ltd</div>
    <div data-testid="agent-company">Best Agents</div>
    <div data-testid="listing-features">
      <span>Balcony</span>
      <span>Parking</span>
    </div>
  </div>
</body>
</html>
